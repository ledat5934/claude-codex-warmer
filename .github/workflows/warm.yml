name: warm-usage-windows

# Sends one "hello" to Claude Haiku 4.5 every time this workflow is triggered.
# No gating: every run sends.
#
# Schedule lives in the Cloudflare Worker (not GitHub cron, which is unreliable):
#   every 5h starting 2026-10-14 12:51 Asia/Ho_Chi_Minh (05:51 UTC)
#   -> 12:51, 17:51, 22:51, 03:51, 08:51, 13:51, ...
# The Worker triggers this workflow via the workflow_dispatch API.
#
# Manual "Run workflow" also sends, for testing. It does NOT shift the
# schedule, because the schedule is fixed in the Worker, not derived from the
# last run.
#
# Auth: CLAUDE_CODE_OAUTH_TOKEN secret (from `claude setup-token`).

on:
  workflow_dispatch:

# Never run two warm-ups at once.
concurrency:
  group: warm
  cancel-in-progress: false

permissions:
  contents: read

env:
  CLAUDE_CLI_VERSION: "2.1.205"   # pinned; bump deliberately
  MODEL: "claude-haiku-4-5-20251001"

jobs:
  warm-claude:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Claude Code CLI
        run: npm install -g "@anthropic-ai/claude-code@${CLAUDE_CLI_VERSION}"

      - name: Send hello
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          echo "Sending at $(TZ='Asia/Ho_Chi_Minh' date '+%F %H:%M %Z')"
          for i in 1 2 3; do
            claude -p "hello" --model "$MODEL" && exit 0
            echo "Attempt $i failed, retrying in 10s..."
            sleep 10
          done
          echo "All 3 attempts failed."
          exit 1

  # If the send fails after retries (e.g. token revoked), open a GitHub issue
  # (GitHub emails you). Auto-closes on the next successful run.
  # Requires Issues to be enabled in repo Settings -> General -> Features.
  notify:
    needs: [warm-claude]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    permissions:
      issues: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      REPO: ${{ github.repository }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      CLAUDE_FAILED: ${{ needs.warm-claude.result == 'failure' }}
      TITLE: "Warm-up needs attention"
    steps:
      - name: Open or update failure issue
        if: env.CLAUDE_FAILED == 'true'
        run: |
          existing=$(gh issue list --repo "$REPO" --state open --json number,title \
            --jq '[.[] | select(.title==env.TITLE)][0].number // empty')
          body="Warm-up failed after 3 retries. Failed run: $RUN_URL"$'\n\n'
          body+='Likely an expired/revoked OAuth token. Fix (run in your own terminal):'$'\n'
          body+='```bash'$'\n'
          body+='claude setup-token'$'\n'
          body+="gh secret set CLAUDE_CODE_OAUTH_TOKEN --repo $REPO"$'\n'
          body+='```'$'\n\n'
          body+="This issue will auto-close the next time the warm-up succeeds."
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "$REPO" --body "$body"
          else
            gh issue create --repo "$REPO" --title "$TITLE" --body "$body"
          fi

      - name: Close resolved failure issue
        if: env.CLAUDE_FAILED == 'false'
        run: |
          existing=$(gh issue list --repo "$REPO" --state open --json number,title \
            --jq '[.[] | select(.title==env.TITLE)][0].number // empty')
          if [ -n "$existing" ]; then
            gh issue close "$existing" --repo "$REPO" \
              --comment "Resolved - a subsequent run succeeded. Closing automatically."
          fi
